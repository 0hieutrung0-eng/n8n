services:
  - type: web
    name: n8n-selfhosted
    env: docker
    plan: starter # Khuyên dùng gói trả phí nhỏ để không bị ngủ đông, hoặc free tùy nhu cầu
    region: oregon # Chọn vùng gần bạn nhất
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1
    envVars:
      - key: WEBHOOK_URL
        sync: false
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
